```html
<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday 🎂</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background:
                radial-gradient(circle at top, #292929 0%, #111 45%, #070707 100%);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
        }

        .card {
            padding: 42px 25px 35px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: cardAppear 1s ease;
        }

        .emoji {
            font-size: 55px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        .small {
            font-size: 12px;
            letter-spacing: 4px;
            color: #aaa;
            margin-bottom: 12px;
        }

        h1 {
            font-size: clamp(42px, 13vw, 62px);
            line-height: 1;
            margin-bottom: 22px;
            letter-spacing: -2px;
        }

        .name {
            background: linear-gradient(90deg, #fff, #aaa, #fff);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        p {
            color: #d0d0d0;
            font-size: 17px;
            line-height: 1.65;
            margin-bottom: 30px;
        }

        .button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 50px;
            background: white;
            color: #111;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
            transition: 0.25s ease;
        }

        .button:active {
            transform: scale(0.95);
        }

        #message {
            display: none;
            margin-top: 25px;
            padding: 18px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            color: #eee;
            font-size: 16px;
            line-height: 1.5;
            animation: messageAppear 0.6s ease;
        }

        .heart {
            position: fixed;
            font-size: 20px;
            bottom: -30px;
            pointer-events: none;
            animation: heartFloat 4s linear forwards;
            z-index: 10;
        }

        .confetti {
            position: fixed;
            width: 8px;
            height: 8px;
            top: -15px;
            pointer-events: none;
            animation: confettiFall 3s linear forwards;
            z-index: 20;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes shine {
            0% {
                background-position: 200%;
            }

            100% {
                background-position: -200%;
            }
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes confettiFall {
            to {
                transform: translateY(110vh) rotate(720deg);
            }
        }

        @keyframes heartFloat {
            to {
                transform: translateY(-110vh) rotate(20deg);
                opacity: 0;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 32px 20px 28px;
            }

            .emoji {
                font-size: 45px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="emoji">🎂</div>

            <div class="small">FÜR ELENI 🎉</div>

            <h1>
                Happy<br>
                Birthday <span class="name">❤️</span>
            </h1>

            <p>
                Ich hoffe, du hast einen schönen Tag und kannst
                in'sha'allah noch 100 Jahre gesund mit deiner
                Familie verbringen. ❤️
            </p>

            <button class="button" id="birthdayButton">
                Klick mich 👀
            </button>

            <div id="message">
                🎉 Überraschung! 🎉<br><br>
                Ich wünsche dir einen richtig schönen Geburtstag
                und hoffe, dass du deinen Tag genießen kannst! 🥳❤️
            </div>

        </div>

    </div>

    <script>
        const button = document.getElementById("birthdayButton");
        const message = document.getElementById("message");

        button.addEventListener("click", function () {

            message.style.display = "block";

            button.innerHTML = "🎉 Noch einmal!";

            // Konfetti
            for (let i = 0; i < 100; i++) {

                const confetti = document.createElement("div");

                confetti.className = "confetti";

                confetti.style.left = Math.random() * 100 + "vw";

                confetti.style.background =
                    "hsl(" + Math.random() * 360 + ", 90%, 65%)";

                confetti.style.animationDuration =
                    (2 + Math.random() * 3) + "s";

                confetti.style.transform =
                    "rotate(" + Math.random() * 360 + "deg)";

                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }

            // Herzen
            for (let i = 0; i < 15; i++) {

                const heart = document.createElement("div");

                heart.className = "heart";
                heart.innerHTML = "❤️";

                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration =
                    (3 + Math.random() * 2) + "s";

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }
        });
    </script>

</body>

</html>
```
