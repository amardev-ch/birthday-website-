```html
<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday 🎂</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0f0f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        .container {
            max-width: 600px;
            padding: 30px;
            position: relative;
            z-index: 2;
        }

        .small {
            font-size: 15px;
            color: #999;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            color: #cccccc;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #111;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.08);
        }

        #message {
            display: none;
            margin-top: 25px;
            font-size: 22px;
            color: white;
            animation: appear 0.5s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -20px;
            animation: fall 3s linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="small">FÜR ELENI 🎉</div>

        <h1>Happy Birthday 🎂</h1>

        <p>
            Ich hoffe, du hast einen schönen Tag und kannst in'sha'allah
            noch 100 Jahre gesund mit deiner Familie verbringen. ❤️
        </p>

        <button onclick="birthday()">Klick mich 👀</button>

        <div id="message">
            🎉 Überraschung! 🎉<br>
            Ich wünsche dir einen richtig schönen Geburtstag! 🥳
        </div>

    </div>

    <script>
        function birthday() {

            document.getElementById("message").style.display = "block";

            for (let i = 0; i < 80; i++) {

                const confetti = document.createElement("div");

                confetti.classList.add("confetti");

                confetti.style.left = Math.random() * 100 + "vw";
                confetti.style.backgroundColor =
                    "hsl(" + Math.random() * 360 + ", 80%, 60%)";

                confetti.style.animationDuration =
                    (Math.random() * 2 + 2) + "s";

                confetti.style.transform =
                    "rotate(" + Math.random() * 360 + "deg)";

                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 4000);
            }
        }
    </script>

</body>

</html>
```
